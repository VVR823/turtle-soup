# TEMPLATE ONLY: include in a reviewed TLS server block; not installed or syntax-verified here.
# The backend must bind loopback and use the owned launcher (proxy_headers=False).
# Configure TRUSTED_PROXY_CIDRS=127.0.0.1/32 only after checking this direct proxy peer.
client_max_body_size 32k;

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /health {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
