worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 上游服务（compose 内网域名，由 docker 自动解析）
    upstream frontend_up {
        server frontend:3000;
    }
    upstream backend_up {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # 前端静态资源 + 页面：交给 Next.js standalone
        location / {
            proxy_pass http://frontend_up;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 覆盖而非追加：nginx 是唯一入口，直接把真实客户端 IP 写入 X-Forwarded-For，
            # 防止客户端伪造 XFF 头绕过后端限流（rate_limit.py 取最后一项即真实 IP）
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后端 API：相对 /api 透传到 FastAPI（前端代码即按此设计）
        location /api/ {
            proxy_pass http://backend_up;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
