[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turtle-soup-backend"
version = "0.1.0"
description = "Turtle Soup AI host and controlled feedback repair backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic>=2,<3",
  "python-dotenv==1.2.3",
  "httpx==0.28.1",
  "certifi>=2026.10.19",
  "langchain-openai==1.6.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "testing*"]
