[pytest]
testpaths = backend/tests backend/eval/tests
pythonpath = backend
cache_dir = .cache/pytest
addopts = -p no:langsmith_plugin --strict-config --strict-markers -ra
norecursedirs = .git node_modules .next .venv .venv-ts01 .cache online
markers =
    real_model: calls a real provider; requires --real-model and explicit free-model confirmation
    online: calls an external deployed service; requires --online
