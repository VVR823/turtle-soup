# 海龟汤「许二木海龟汤自助」容器化部署
# 架构：nginx(80) 反代 -> frontend(Next.js :3000) + backend(FastAPI :8000)
# 前端使用相对 /api，由 nginx 透传到 backend，无需额外配置 CORS。
#
# 用法（在服务器 /opt/turtle-soup 目录，文件已就位后）：
#   docker compose up -d --build      # 首次构建并启动
#   docker compose logs -f backend    # 看后端日志
#   docker compose down               # 停止
#
# 数据持久化：backend/data 通过 bind mount 映射到宿主机 /opt/turtle-soup/backend/data，
# 现有 sessions.db / traces / 反馈文件不丢。

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    # 读取服务器上已有的 backend/.env（含 SITE_PASSWORD / SILICONFLOW_API_KEY 等）
    env_file:
      - ./backend/.env
    environment:
      - ENABLE_TRACE=1
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    # 不暴露宿主机端口，仅 nginx（同网络）可访问

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    # 不暴露宿主机端口，仅 nginx（同网络）可访问

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
